apply plugin: 'com.android.application'
//apply plugin: 'io.fabric'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'kotlin-android'
//apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-parcelize'
android {
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        unitTests.all {
            jvmArgs '-Djdk.attach.allowAttachSelf=true'
        }
    }

    aaptOptions {
        ignoreAssetsPattern "ftp-sync.json:!.idea:!.vscode"
    }
    signingConfigs {
        release {
//            storeFile file('D:\\workspace\\softm.navi.poweron\\softm.keystore.jks')
            storeFile file('/Users/softm/workspace/softm.navi.poweron.new/softm.keystore.jks')
            storePassword 'softm123'
            keyAlias = 'softm'
            keyPassword 'softm123'
        }
        rdebug {
//            storeFile file('D:\\workspace\\softm.navi.poweron\\softm.keystore.jks')
            storeFile file('/Users/softm/workspace/softm.navi.poweron.new/softm.keystore.jks')
            storePassword 'softm123'
            keyAlias = 'softm'
            keyPassword 'softm123'
        }
        debug {
        }
        dev {
        }
        local {
        }
        local_asset {
        }
    }

    compileSdkVersion 34
    buildToolsVersion "30.0.0"

    tasks.withType(JavaCompile).configureEach{
        options.fork = true
        options.forkOptions.jvmArgs +=[
                '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
                '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
                '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED']
    }
    defaultConfig {
        applicationId "net.softm.data.kata"
        minSdkVersion 23 // minSdkVersion 19 --> 23 : com.kakao.sdk:v2-navi:2.20.3 지원을 위해
        targetSdkVersion 35
// RELEASE 25, 1.0.2.000 : 2023.10.07
// RELEASE 4, 1.0.3.000 : 2025.05.28
// RELEASE 5, 1.0.3.000 : 2025.06.01
// RELEASE 6, 1.0.3.000 : 2025.06.04
// RELEASE 7, 1.0.4.000 : 2025.06.04
// RELEASE 8, 1.0.5.000 : 2025.06.07
// RELEASE 9, 1.0.6.000 : 2025.06.07
        versionCode 3
        versionName "1.0.0.002" // 9

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        setProperty("archivesBaseName", "softm.data.kata-$versionName-$versionCode")
        multiDexEnabled true

    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            debuggable false
        }
        rdebug { // dev relase
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
//            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            debuggable true
// speed optimize
            splits.abi.enable = false
            splits.density.enable = false
//            resConfigs('en','xhdpi')
            aaptOptions.cruncherEnabled = false

//            // crashlytics 빌드 ID 업데이트 막기
//            ext.alwaysUpdateBuildId = false
//            // crashlytics 실행하지 않음
//            manifestPlaceholders = [enableCrashReporting:"false"]
        }

        debug {
//            resValue "string","app_name", "실시간 농산물 경매시세_DEV"
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            debuggable true
// speed optimize
/*            splits.abi.enable = false
            splits.density.enable = false
//            resConfigs('en','xhdpi')
            aaptOptions.cruncherEnabled = false

            // crashlytics 빌드 ID 업데이트 막기
            ext.alwaysUpdateBuildId = false*/
/*
            // crashlytics 실행하지 않음
            manifestPlaceholders = [enableCrashReporting:"false"]
*/
 //
//            // crashlytics 플러그인을 사용하지 않음
//            ext.enableCrashlytics = false
//
//            // crashlytics 빌드 ID 업데이트 막기
//            ext.alwaysUpdateBuildId = false

        }

        dev {
//            resValue "string","app_name", "실시간 농산물 경매시세_DEV"
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
//            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            debuggable true
// speed optimize
            splits.abi.enable = false
            splits.density.enable = false
//            resConfigs('en','xhdpi')
            aaptOptions.cruncherEnabled = false

            // crashlytics 빌드 ID 업데이트 막기
            ext.alwaysUpdateBuildId = false
/*
            // crashlytics 실행하지 않음
            manifestPlaceholders = [enableCrashReporting:"false"]
*/
        }
        local {
//            resValue "string","app_name", "실시간 농산물 경매시세_DEV"
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
//            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            debuggable true
// speed optimize
            splits.abi.enable = false
            splits.density.enable = false
//            resConfigs('en','xhdpi')
            aaptOptions.cruncherEnabled = false

            // crashlytics 빌드 ID 업데이트 막기
            ext.alwaysUpdateBuildId = false
/*
            // crashlytics 실행하지 않음
            manifestPlaceholders = [enableCrashReporting:"false"]
*/
        }
        local_asset {
            signingConfig signingConfigs.debug
//            minifyEnabled false
//            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            debuggable true
        }

    }

    configurations.all {
        resolutionStrategy.force 'com.google.code.findbugs:jsr305:1.3.9'
    }

    dataBinding {
        enabled = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
        languageVersion = "1.8"
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar","*.aar"])
    implementation project(path: ':dot-progress-bar')
    implementation project(path: ':softmcommon')
    implementation project(path: ':chipCloud')

    implementation 'androidx.appcompat:appcompat:1.2.0'
